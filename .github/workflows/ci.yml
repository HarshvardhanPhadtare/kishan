name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend validation
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate frontend files
        run: |
          test -f frontend/index.html
          test -f frontend/vercel.json

          echo "No frontend dependencies or lint, test, type-check, or build scripts are configured."

  backend:
    name: Backend validation
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Check backend JavaScript syntax
        working-directory: backend
        run: |
          find src -type f -name '*.js' -print0 | xargs -0 -n1 node --check

          echo "No backend lint, test, type-check, or build scripts are configured."


          
  health-monitor:
    name: Basic Health Monitoring
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    if: always()

    steps:
      - name: Check project health
        env:
          FRONTEND_STATUS: ${{ needs.frontend.result }}
          BACKEND_STATUS: ${{ needs.backend.result }}
        run: |
          echo "================================"
          echo "     PROJECT HEALTH CHECK"
          echo "================================"

          if [ "$FRONTEND_STATUS" = "success" ] && [ "$BACKEND_STATUS" = "success" ]; then
            echo "STATUS: HEALTHY"
            echo "All CI checks passed."
          else
            echo "STATUS: UNHEALTHY"
            echo "One or more CI checks failed."
            exit 1
          fi

